<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Los_ALMEYDAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-inter">
    
  
   <header class="bg-white shadow-md p-4 flex items-center rounded-b-lg">
  <!-- Logo a la izquierda sin espacio -->
  <div class="flex-shrink-0">
    <img src="Imagenes/logo.jpeg" alt="Logo" class="h-16">
  </div>

  <!-- Contenedor central para los enlaces, que se expande y centra -->
  <nav class="flex flex-grow justify-center space-x-8 font-sans">
    <a href="/index.html" class="bg-transparent text-red-600 py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:shadow-md hover:bg-gray-300 hover:text-black">
      Seguir Comprando
    </a>

    <a href="/nosotros.html" class="bg-transparent text-red-600 py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:shadow-md hover:bg-gray-300 hover:text-black">
      Nosotros
    </a>

    <a id="admin-link" href="/dashboard.html" class="bg-transparent text-red-600 py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:shadow-md hover:bg-gray-300 hover:text-black hidden">
      Gestión de Productos
    </a>

    <a href="/cart.html" class="bg-gray-200 shadow-md text-black py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:shadow-md hover:bg-gray-300 hover:text-black">
      🛒 Caja de pago
    </a>

    <button id="logout-button" class="bg-transparent hover:bg-gray-400 text-red-600 py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 hover:shadow-md hover:bg-gray-300 hover:text-black">
      Cerrar Sesión
    </button>
  </nav>

  <!-- Icono de usuario a la derecha sin espacio -->
  <button class="login-btn flex-shrink-0" onclick="location.href='/auth.html'" style="background: none; border: none; cursor: pointer;">
    <img src="/imag/icons8_usuario_32.png" alt="Login" style="width: 24px; height: 24px;">
  </button>
</header>

    


    <main class="container mx-auto p-6 flex-grow">
        <div id="message-box" class="message-box"></div>
        <div id="loading-spinner" class="spinner-container">
            <div class="spinner"></div>
            <span>Procesando pedido...</span>
        </div>

        <div id="cart-items-container" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Productos en el Carrito</h2>
            <div id="cart-list" class="space-y-4">
                <p id="empty-cart-message" class="text-gray-600 text-center hidden">Tu carrito está vacío.</p>
                </div>
                <span class="text-xl font-bold text-red-800 mr-4 mb-4 sm:mb-0 ">Total: $<span id="cart-total">0.00</span></span>
                
                  <h2 class="icon-box-title" style="text-align:center; margin-top:5%; color:#333; font-weight:600; font-size:1.5rem;">
    Métodos de Pago
  </h2>
  
  
  
  
<ul class="icon-list" style="list-style:none; margin:0; padding:0;">
  <li class="icon-list-item" 
      style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; transition:background-color 0.3s;"
      onclick="mostrarImagen('imag/qr_code.png')">
    <img src="Imagenes/Bancolombia.png" alt="Bancolombia" class="icon-image" style="max-height:40px; width:auto; margin-right:15px; flex-shrink:0;">
    <span class="icon-text" style="font-size:1.1rem; color:#555;">Bancolombia</span>
  </li>

  <li class="icon-list-item" 
      style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; transition:background-color 0.3s;"
      onclick="mostrarImagen('imag/qr_code.png')">
    <img src="Imagenes/nequi_logo.png" alt="Nequi" class="icon-image" style="max-height:40px; width:auto; margin-right:15px; flex-shrink:0;">
    <span class="icon-text" style="font-size:1.1rem; color:#555;">Nequi</span>
  </li>

  <li class="icon-list-item" 
      style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; transition:background-color 0.3s;"
      onclick="mostrarImagen('imag/qr_code.png')">
    <img src="imag/Boton_Pse.png" alt="PSE" class="icon-image" style="max-height:40px; width:auto; margin-right:15px; flex-shrink:0;">
    <span class="icon-text" style="font-size:1.1rem; color:#555;">PSE</span>
  </li>

  <li class="icon-list-item" 
      style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #eee; cursor:pointer; transition:background-color 0.3s;"
      onclick="mostrarImagen('imag/qr_code.png')">
    <img src="Imagenes/daviplata-logo.png" alt="DaviPlata" class="icon-image" style="max-height:40px; width:auto; margin-right:15px; flex-shrink:0;">
    <span class="icon-text" style="font-size:1.1rem; color:#555;">DaviPlata</span>
  </li>
</ul>

<!-- Modal oculto -->
<div id="modalImagen" style="
  display:none; 
  position:fixed; 
  top:0; left:0; 
  width:100%; height:100%; 
  background:rgba(0,0,0,0.8); 
  justify-content:center; 
  align-items:center; 
  z-index:9999;">
  <img id="imagenModal" src="" alt="Imagen ampliada" style="
    max-width:90%; 
    max-height:90%; 
    border-radius:8px; 
    box-shadow:0 0 10px white;
    cursor:pointer;
  ">
</div>

<script>
function mostrarImagen(ruta) {
  const modal = document.getElementById('modalImagen');
  const img = document.getElementById('imagenModal');
  img.src = ruta;
  modal.style.display = 'flex';

  // Cierra el modal al hacer clic en la imagen
  img.onclick = () => {
    modal.style.display = 'none';
    img.src = '';
  };

  // También cerrar modal al hacer clic fuera de la imagen
  modal.onclick = (e) => {
    if (e.target === modal) {
      modal.style.display = 'none';
      img.src = '';
    }
  };
}
</script>

  
  
  
            <div class="flex flex-col sm:flex-row justify-end items-center mt-6 pt-4 border-t border-gray-200">
                          
                <button id="checkout-button" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                 <a href="/index.html" class="">
      			💳  Finalizar Compra
    		</a>
    

                </button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-8 rounded-t-lg">
        <p>&copy; 202 Los ALMEYDAS. Todos los derechos reservados.</p>
    </footer>

    <script src="/js/cart.js"></script>
</body>
</html>
