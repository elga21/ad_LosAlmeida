<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Los_ALMEYDAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-inter">
    <header class="bg-white shadow-md p-4 flex justify-between items-center rounded-b-lg">
        <h1 class="text-2xl font-bold text-gray-800">🛒 Mi Carrito de Compras</h1>
        <nav class="flex items-center">
            <a href="/index.html" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 mr-4 shadow-md">
                Seguir Comprando
            </a>
            <button id="logout-button" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                Cerrar Sesión
            </button>
        </nav>
    </header>

    <main class="container mx-auto p-6 flex-grow">
        <div id="message-box" class="message-box"></div>
        <div id="loading-spinner" class="spinner-container">
            <div class="spinner"></div>
            <span>Procesando pedido...</span>
        </div>

        <div id="cart-items-container" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Productos en el Carrito</h2>
            <div id="cart-list" class="space-y-4">
                <p id="empty-cart-message" class="text-gray-600 text-center hidden">Tu carrito está vacío.</p>
                </div>
            <div class="flex flex-col sm:flex-row justify-end items-center mt-6 pt-4 border-t border-gray-200">
                <span class="text-xl font-bold text-gray-800 mr-4 mb-4 sm:mb-0">Total: $<span id="cart-total">0.00</span></span>
                <button id="checkout-button" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white p-4 text-center mt-8 rounded-t-lg">
        <p>&copy; 2024 Los_ALMEYDAS. Todos los derechos reservados.</p>
    </footer>

    <script src="/js/cart.js"></script>
</body>
</html>
